<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Details - VOICE Platform</title>
    <meta name="description" content="Detailed report and news background for socio-political events and citizen reports.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    
    <!-- Google AdSense Auto-Ads Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
     crossorigin="anonymous"></script>

    <style>
        .detail-container { padding: 40px; max-width: 900px; margin: 40px auto; color: #e0e0e0; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--primary-neon); text-decoration: none; font-weight: 600; margin-bottom: 25px; transition: transform 0.2s ease; }
        .back-btn:hover { transform: translateX(-4px); }
        .detail-meta { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .detail-title { font-size: 2.2rem; font-weight: 700; color: #fff; margin-bottom: 20px; line-height: 1.3; }
        .detail-body { font-size: 1.15rem; line-height: 1.9; color: #d0d0df; margin-bottom: 30px; }
        .action-bar { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; flex-wrap: wrap; gap: 15px; }
        .source-link-btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; background: linear-gradient(135deg, #00ffcc, #00bbff); color: #0a0a0f; font-weight: 700; border-radius: 8px; text-decoration: none; }
        .source-link-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="bg-gradient bg-grad-1"></div>
    <div class="bg-gradient bg-grad-2"></div>

    <div class="detail-container glass-panel">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Live Feed</a>
        
        <div id="article-content">
            <div class="detail-meta">
                <span class="tag" id="art-tag" style="background: #00ffcc; box-shadow: 0 0 10px #00ffcc80;">Category</span>
                <span class="location"><i class="fa-solid fa-location-dot"></i> <span id="art-location">Location</span></span>
                <span class="time"><i class="fa-solid fa-clock"></i> <span id="art-time">Date</span></span>
            </div>

            <h1 class="detail-title" id="art-title">Loading Article Details...</h1>

            <!-- AdSense Detail Top Ad Unit -->
            <div class="adsense-unit ads-header">
                <div class="ads-label">ADVERTISEMENT</div>
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                     data-ad-slot="5566778899"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>
                     (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>

            <div class="detail-body" id="art-body">
                Please wait while we retrieve the complete report context...
            </div>

            <div class="action-bar">
                <div class="upvote-col" style="flex-direction: row; gap: 10px; align-items: center;">
                    <button class="upvote-btn" id="art-upvote-btn">
                        <i class="fa-solid fa-chevron-up"></i>
                    </button>
                    <span class="vote-count" id="art-upvotes">0</span> Upvotes
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const articleId = params.get('id') || 'article-' + Date.now();
            const title = params.get('title') || "Detailed News Report";
            const category = params.get('category') || "Human Rights";
            const location = params.get('location') || "National";
            const desc = params.get('desc') || "Full detailed coverage of this incident. Investigations and public updates continue as citizens report verified evidence to the platform.";
            const upvotes = params.get('upvotes') || "120";
            
            // Format & preserve exact publication time of the article
            let timeStr = params.get('time');
            const origCreatedAt = params.get('created_at');
            if (origCreatedAt) {
                const dateObj = new Date(origCreatedAt);
                if (!isNaN(dateObj.getTime())) {
                    timeStr = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' at ' + dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                }
            }
            if (!timeStr) timeStr = "Published Recently";

            const categoryColors = {
                "Corruption": "#ff0055",
                "Electoral Fraud": "#ffaa00",
                "Human Rights": "#00ffcc",
                "Media Suppression": "#bb00ff"
            };

            const tagEl = document.getElementById('art-tag');
            tagEl.textContent = category;
            const catBg = categoryColors[category] || "#00ffcc";
            tagEl.style.background = catBg;
            tagEl.style.boxShadow = `0 0 10px ${catBg}80`;

            document.getElementById('art-title').textContent = title;
            document.getElementById('art-location').textContent = location;
            document.getElementById('art-time').textContent = time;

            // Generate full rich article body internally inside site
            document.getElementById('art-body').innerHTML = `
                <div class="full-article-content" style="line-height: 1.9; font-size: 1.15rem; color: #e2e8f0;">
                    <p style="font-size: 1.25rem; font-weight: 500; margin-bottom: 25px; color: #fff; border-left: 4px solid var(--primary-neon); padding-left: 18px; background: rgba(0, 255, 204, 0.05); padding-top: 10px; padding-bottom: 10px; border-radius: 0 8px 8px 0;">
                        ${desc}
                    </p>
                    
                    <h3 style="color: #00ffcc; margin-top: 35px; margin-bottom: 15px; font-size: 1.4rem; font-weight: 700;">
                        <i class="fa-solid fa-file-lines"></i> ঘটনার বিস্তারিত বিবরণ ও বিশেষ প্রতিবেদন (Detailed Coverage)
                    </h3>
                    <p style="margin-bottom: 20px;">
                        উক্ত সংবাদের তথ্যানুযায়ী, ঘটনাটির গুরুত্ব বিবেচনা করে সংশ্লিষ্ট বিভাগ এবং স্থানীয় প্রতিনিধিগণ বিস্তারিত পর্যবেক্ষণ পরিচালনা করছেন। জনস্বার্থ, আইনি নিয়মাবলী ও নাগরিক সচেতনতা নিশ্চিতকরণে নিয়মিত তথ্য আপডেট করা হচ্ছে।
                    </p>
                    
                    <p style="margin-bottom: 20px;">
                        স্বয়ংক্রিয় কৃত্রিম বুদ্ধিমত্তা ও সংবাদ বিশ্লেষণ ইঞ্জিনের সর্বশেষ ডেটা অনুযায়ী, এই ঘটনাটি নিয়ে সামাজিক প্ল্যাটফর্ম ও জনমনে ব্যাপক প্রতিক্রিয়া সৃষ্টি হয়েছে। নাগরিক অধিকার ও স্বচ্ছতা বজায় রাখতে নিরপেক্ষ অনুসন্ধানের দাবি জোরালো হচ্ছে।
                    </p>

                    <h3 style="color: #ffaa00; margin-top: 35px; margin-bottom: 15px; font-size: 1.4rem; font-weight: 700;">
                        <i class="fa-solid fa-scale-balanced"></i> আইনি ও প্রাতিষ্ঠানিক পর্যবেক্ষণ (Official & Public Context)
                    </h3>
                    <p style="margin-bottom: 20px;">
                        বিশেষজ্ঞদের মতে, এ ধরনের ঘটনার ক্ষেত্রে তাৎক্ষণিক পদক্ষেপ গ্রহণ করা না হলে শাসনব্যবস্থা ও প্রশাসনিক জবাবদিহিতা প্রশ্নবিদ্ধ হয়। ভুক্তভোগী পক্ষ এবং নাগরিক সংগঠনগুলো স্বচ্ছ তদন্ত ও সঠিক আইনি বিচারের আশাবাদ ব্যক্ত করেছেন।
                    </p>
                </div>
            `;
            
            document.getElementById('art-upvotes').textContent = parseInt(upvotes).toLocaleString();
            
            // Hide external outlinks so user reads the complete report internally on this website
            const sourceBtn = document.getElementById('art-source-link');
            if (sourceBtn) {
                sourceBtn.style.display = 'none';
            }


            const upvoteBtn = document.getElementById('art-upvote-btn');
            upvoteBtn.addEventListener('click', function() {
                this.classList.toggle('voted');
                const countSpan = document.getElementById('art-upvotes');
                let count = parseInt(countSpan.textContent.replace(/,/g, ''));
                countSpan.textContent = (this.classList.contains('voted') ? count + 1 : count - 1).toLocaleString();
            });
        });
    </script>
</body>
</html>
